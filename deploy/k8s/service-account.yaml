# Service accounts for the M4 kind demo (namespace from deploy/k8s/namespace.yaml).
# nextflow-runner: the in-cluster Nextflow controller; its API token is projected only into the
#   controller container of the runner Job (deploy/k8s/runner-job.yaml.tmpl).
# workflow-worker: the scientific task pods that Nextflow submits (k8s.serviceAccount). It has
#   no role binding and never receives an API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextflow-runner
  namespace: ligand-analysis
  labels:
    app.kubernetes.io/part-of: ligand-analysis
    app.kubernetes.io/component: nextflow-controller
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-worker
  namespace: ligand-analysis
  labels:
    app.kubernetes.io/part-of: ligand-analysis
    app.kubernetes.io/component: workflow-worker
automountServiceAccountToken: false